name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Effect diagnostics
        run: bun run effect:diagnostics

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The packed-tarball consumer smoke deliberately does NOT run here. It is
      # a publish gate, and publishing is local-and-manual by design: step 5 of
      # `bun run publish:npm` builds a clean consumer against the tarballs and
      # refuses to publish if it fails, so no release reaches npm unsmoked.
      # Run it on demand with `bun run verify:pack`.
      - name: Pack core dry run
        working-directory: packages/core
        run: bun pm pack --dry-run

      - name: Pack react dry run
        working-directory: packages/react
        run: bun pm pack --dry-run

      - name: Pack devtools dry run
        working-directory: packages/devtools
        run: bun pm pack --dry-run

      # The hub is the one package that ships source rather than a bundle, so
      # its pack is the only check that its bin target is inside the tarball.
      - name: Pack hub dry run
        working-directory: apps/hub
        run: bun pm pack --dry-run
